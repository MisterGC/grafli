[build-system]
requires = ["hatchling>=1.21", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "grafli"
description = "A keyboard-driven, plain-text diagram tool with vim-style editing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "python-pptx>=1.0", "textli-editor>=0.8.0"]
keywords = ["diagram", "whiteboard", "vim", "architecture", "plain-text"]
authors = [
    { name = "Serein Pfeiffer", email = "s.pfeiffer@klebert-engineering.de" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Software Development :: Documentation",
]
dynamic = ["version"]

[project.optional-dependencies]
# `grafli serve`: the live board in a browser tab.
serve = ["starlette>=0.37", "uvicorn>=0.30", "websockets>=13"]
dev = ["pytest>=8", "pytest-qt>=4", "grafli[serve]"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-glightbox>=0.4",
    # Floor is a security bound, not a feature one: < 10.21.3 carries
    # PYSEC-2026-2999.
    "pymdown-extensions>=10.21.3",
]

[project.scripts]
grafli = "grafli.app:main"

[project.urls]
Documentation = "https://grafli.mistergc.dev"
Repository = "https://github.com/MisterGC/grafli"
Issues = "https://github.com/MisterGC/grafli/issues"
Changelog = "https://github.com/MisterGC/grafli/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "grafli/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["grafli"]

# The example boards the grafli skill names ship inside it (grafli.skills);
# a test keeps this list equal to the boards the skill's text names.
[tool.hatch.build.targets.wheel.force-include]
"examples/architecture.grafli" = "grafli/skills/grafli/examples/architecture.grafli"
"examples/architecture-res" = "grafli/skills/grafli/examples/architecture-res"
"examples/infographic-demo.grafli" = "grafli/skills/grafli/examples/infographic-demo.grafli"
"examples/layers-map.grafli" = "grafli/skills/grafli/examples/layers-map.grafli"
"examples/layers-map-res" = "grafli/skills/grafli/examples/layers-map-res"
"examples/navigation-map.grafli" = "grafli/skills/grafli/examples/navigation-map.grafli"
"examples/navigation-map-res" = "grafli/skills/grafli/examples/navigation-map-res"
"examples/oauth-callback.grafli" = "grafli/skills/grafli/examples/oauth-callback.grafli"
"examples/sketchnote-demo.grafli" = "grafli/skills/grafli/examples/sketchnote-demo.grafli"

[tool.hatch.build.targets.sdist]
include = [
    "/grafli",
    "/tests",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
